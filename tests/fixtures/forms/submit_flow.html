<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Acme — Software Engineer</title></head>
<body>
<h1>Software Engineer</h1>
<!-- Job pages often thank you up front; that must not count as a confirmation -->
<p>Thank you for your interest in Acme. Try again later if the form doesn't load.</p>
<form id="f">
  <label for="fn">First Name*</label><input id="fn" required>
  <label for="ln">Last Name*</label><input id="ln" required>
  <label for="em">Email*</label><input id="em" type="email" required>
  <label for="cv">Resume*</label><input id="cv" type="file" required>
  <button type="submit">Submit application</button>
</form>
<script>
  // #thanks (default): accepted. #code: emailed security code. #error: rejected.
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    window.submitCount = (window.submitCount || 0) + 1;
    const mode = location.hash.slice(1) || 'thanks';
    setTimeout(() => {
      document.body.innerHTML = {
        thanks: '<h1>Thank you for applying!</h1><p>Your application has been received.</p>',
        code: '<h1>Almost there</h1><p>Enter the 8-character security code we sent to your email.</p><input>',
        error: '<h1>Software Engineer</h1><p class="error">There was an error submitting your application.</p>',
      }[mode];
    }, 800);
  });
</script>
</body></html>
