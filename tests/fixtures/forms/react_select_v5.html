<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Greenhouse — react-select v5 behaviour</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 20px auto; }
  .field { margin: 14px 0; position: relative; } .label { font-weight: bold; display: block; }
  .select__control { border: 1px solid #aaa; display: flex; position: relative; min-height: 30px; }
  .select__single-value, .select__placeholder { position: absolute; left: 6px; top: 6px; pointer-events: none; }
  .select__placeholder { color: #888; }
  .select__input { border: 0; outline: 0; flex: 1; background: transparent; }
  /* menus are portaled to <body>, like Greenhouse's react-select */
  .select__menu { border: 1px solid #aaa; background: #fff; position: absolute; z-index: 10; width: 400px; }
  .select__option { padding: 4px; cursor: pointer; }
  .shadow { opacity: 0; position: absolute; height: 1px; width: 100%; left: 0; bottom: 0; }
  /* A list that belongs to no question and never closes (a widget elsewhere
     on the page). Its options must not be confused with a dropdown's own. */
  #stale { position: fixed; right: 0; top: 0; width: 120px; background: #eee; }
</style></head>
<body>
<div id="stale" role="listbox"><div role="option">Yes</div><div role="option">No</div><div role="option">India</div></div>
<h1>Software Engineer</h1>
<form id="application-form" onsubmit="return false;">
  <div class="field"><label for="first_name" class="label">First Name*</label><input id="first_name" required></div>
  <!-- The phone number's dial-code picker is labelled just "Country" on the live form -->
  <div class="field" data-select="country" data-label="Country*" data-search="1"
       data-options="Canada +1|India +91|United Kingdom +44|United States +1|United States Minor Outlying Islands +1"></div>
  <div class="field" data-select="spons" data-label="Will you now or in the future require sponsorship?*" data-options="Yes|No"></div>
  <div class="field" data-select="h1b" data-label="Have you held H-1B status in the past six years?*" data-options="Yes|No"></div>
  <div class="field" data-select="citizen" data-label="In which country/region do you have citizenship?*" data-search="1" data-options="Canada|China|India|United States"></div>
  <!-- A broken widget: clicking an option doesn't keep it -->
  <div class="field" data-select="future" data-label="Would you like to be considered for future opportunities?*" data-options="Yes|No" data-broken="1"></div>
  <div class="field"><label for="why" class="label">Why do you want to work here?*</label><textarea id="why" required></textarea></div>
  <button type="submit">Submit application</button>
</form>
<script>
  document.querySelectorAll('[data-select]').forEach(f => {
    const name = f.dataset.select, lid = name + '-label', listId = `react-select-${name}-listbox`;
    const searchable = !!f.dataset.search;
    f.innerHTML = `<label id="${lid}" class="label" for="${name}">${f.dataset.label}</label>
      <div class="select__control"><div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <input class="select__input" role="combobox" aria-labelledby="${lid}" aria-autocomplete="list"
               aria-expanded="false" id="${name}" ${searchable ? '' : 'readonly'} autocomplete="off"></div></div>
      <input class="shadow" tabindex="-1" required aria-hidden="true" name="${name}_v">`;
    const box = f.querySelector('[role=combobox]'), shadow = f.querySelector('.shadow'),
          values = f.querySelector('.select__value-container');
    let menu = null;
    const close = () => {
      if (menu) { menu.remove(); menu = null; }
      box.setAttribute('aria-expanded', 'false'); box.removeAttribute('aria-controls');
    };
    const open = q => {
      close();
      const items = f.dataset.options.split('|').filter(o => o.toLowerCase().includes((q || '').toLowerCase()));
      menu = document.createElement('div');
      menu.className = 'select__menu'; menu.id = listId; menu.setAttribute('role', 'listbox');
      menu.innerHTML = items.map((o, i) =>
        `<div class="select__option" role="option" id="react-select-${name}-option-${i}">${o}</div>`).join('');
      const r = f.querySelector('.select__control').getBoundingClientRect();
      menu.style.left = (r.left + scrollX) + 'px'; menu.style.top = (r.bottom + scrollY) + 'px';
      document.body.appendChild(menu);
      box.setAttribute('aria-expanded', 'true'); box.setAttribute('aria-controls', listId);
      menu.addEventListener('click', e => {
        if (e.target.getAttribute('role') !== 'option') return;
        if (!f.dataset.broken) {
          // react-select: the input empties, the choice shows in a single-value div
          values.querySelector('.select__placeholder, .select__single-value').outerHTML =
            `<div class="select__single-value">${e.target.textContent}</div>`;
          shadow.value = e.target.textContent;
        }
        box.value = ''; close();
      });
    };
    box.addEventListener('click', () => open(''));
    box.addEventListener('input', () => open(box.value));
    box.addEventListener('keydown', e => { if (e.key === 'Escape') { box.value = ''; close(); } });
  });
</script>
</body></html>
