# ── Discovery ──
# No company list needed. Every run searches the web for recent postings on
# each public ATS and reads job feeds; every company board found is saved to
# the board registry (data/registry.db) and re-checked on later runs.
# See what's been found with `jobpipe boards`.
discovery:
  enabled: true
  recency: week            # day | week | month — how fresh search results must be
  include_location: true   # add your target locations to search queries
  search_delay: 2.0        # seconds between search queries (avoids rate limits)
  max_queries: null        # cap queries per run (null = one per platform × role keyword)
  concurrency: 8           # boards scraped in parallel
  feed_max_age_days: 30    # ignore feed roles posted longer ago than this
  feeds:
    simplify_new_grad: true                 # SimplifyJobs/New-Grad-Positions (daily)
    simplify_categories: ["Software", "AI/ML/Data"]

# ── Pinned companies (optional) ──
# Boards you always want checked, even if discovery hasn't surfaced them.
# Not required — leave empty and discovery does the work.
ats:
  greenhouse: []
  ashby: []
  lever: []
  smartrecruiters: []   # slugs are case-sensitive, e.g. "Visa"
  workable: []          # e.g. "huggingface"
  bamboohr: []          # subdomain only, e.g. "acme" for acme.bamboohr.com
  workday: []           # host/site, e.g. "nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite"

# ── Sponsorship Filter Toggle ──
# Set to false to disable sponsorship filtering entirely
sponsorship_filter_enabled: true

# ── Sponsorship Blocklist ──
# Companies confirmed to not sponsor (supplementary info, not a blocker)
sponsorship_blocklist:
  - "palantir"  # Example — verify before adding
