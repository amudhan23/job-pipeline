<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Twitch — Software Engineer II</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 20px auto; }
  .field { margin: 14px 0; position: relative; } .label { font-weight: bold; display: block; }
  /* Menus float over the questions below them, like react-select's */
  .menu { border: 1px solid #aaa; background: #fff; position: absolute; top: 100%; left: 0; right: 0; z-index: 10; } .menu [role=option] { padding: 4px; cursor: pointer; }
  /* react-select's hidden validation input: in the DOM, required, invisible */
  .shadow { opacity: 0; position: absolute; height: 1px; width: 100%; left: 0; bottom: 0; }
</style></head>
<body>
<h1>Software Engineer II, Fintech</h1>
<form id="application-form" onsubmit="window.submitted = true; return false;">
  <div class="field"><label for="first_name" class="label">First Name*</label><input id="first_name" required></div>
  <div class="field"><label for="email" class="label">Email*</label><input id="email" type="email" required></div>

  <!-- Copied from the live Twitch form: the file input's own label is just
       "Attach"; the question lives on the role=group, which is the required one -->
  <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
    <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
    <div class="file-upload__wrapper"><div class="button-container"><div class="secondary-button"><div>
      <button type="button" class="btn btn--rounded">Attach</button>
      <label class="visually-hidden" for="resume">Attach</label>
      <input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div>
      <div class="secondary-button"><button type="button">Dropbox</button></div>
      <div class="secondary-button"><div><button type="button" data-testid="resume-text">Enter manually</button>
      <label class="visually-hidden" for="resume_text">Enter manually</label></div></div></div></div></div>
  <div role="group" aria-labelledby="upload-label-cover_letter" aria-required="false" class="file-upload">
    <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
    <div class="file-upload__wrapper"><div class="button-container"><div class="secondary-button"><div>
      <button type="button" class="btn btn--rounded">Attach</button>
      <label class="visually-hidden" for="cover_letter">Attach</label>
      <input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div></div></div></div>

  <!-- Dropdowns are built by script below. Each has a visible combobox and a hidden twin input. -->
  <div class="field" data-select="country" data-label="Country*" data-search="1"
       data-options="Canada|India|United Kingdom|United States|United States Minor Outlying Islands"></div>
  <div class="field" data-select="city" data-label="Location (City)*" data-search="1" data-async="1"></div>
  <!-- Real Twitch: worded yes/no, but the options are cities -->
  <div class="field" data-select="relocate" data-label="Are you open to relocation? *" data-search="1"
       data-options="No|No, but I'm open to a remote position|San Francisco, CA|Seattle, WA|New York, NY|London, UK|Seoul, Korea|Tokyo, Japan|Berlin, Germany|Singapore|Sydney, Australia"></div>
  <div class="field" data-select="employee" data-label="Are you currently a Twitch employee?*" data-options="Yes|No"></div>
  <div class="field" data-select="amazon" data-label="Are you a current employee with Amazon or any Amazon subsidiary (outside of Twitch)?*" data-options="Yes|No"></div>
  <div class="field" data-select="eligible" data-label="If offered employment by Amazon, would you be legally eligible to begin employment immediately?*" data-options="Yes|No"></div>
  <div class="field" data-select="spons" data-label="Your response is mandatory when applying for a U.S.-based position. Do you need, or will you need in the future, sponsorship to work in the U.S.?*" data-options="Yes|No"></div>
  <div class="field" data-select="h1b" data-label="Have you held H-1B status, or had an H-1B petition approved on your behalf, within the past six years?*" data-options="Yes|No"></div>
  <div class="field" data-select="citizen" data-label="In which country/region do you have citizenship?*" data-search="1" data-options="Canada|China|India|United States"></div>
  <div class="field" data-select="future" data-label="Would you like to be considered for future opportunities at Twitch when you apply?*" data-options="Yes|No"></div>
  <div class="field" data-select="exp" data-label="How would you describe your experience with Twitch? (Select one)*"
       data-options="I watch streams|I stream|I don't use Twitch"></div>

  <!-- Checkbox list answering one question -->
  <fieldset class="field"><legend>Which other platforms are you active on? (Select all that apply)</legend>
    <label><input type="checkbox" name="plat[]" value="tt"> TikTok</label>
    <label><input type="checkbox" name="plat[]" value="yt"> YouTube</label>
    <label><input type="checkbox" name="plat[]" value="none"> None</label></fieldset>

  <button type="submit">Submit application</button>
</form>
<script>
  const cities = ['New York, NY, USA', 'New York Mills, MN, USA', 'Newark, NJ, USA'];
  document.querySelectorAll('[data-select]').forEach(f => {
    const name = f.dataset.select, lid = name + '-label';
    const searchable = !!f.dataset.search;
    f.innerHTML = `<label id="${lid}" class="label">${f.dataset.label}</label>
      <input role="combobox" aria-labelledby="${lid}" aria-autocomplete="list" id="${name}"
             ${searchable ? '' : 'readonly'} autocomplete="off">
      <div class="menu" hidden></div>
      <input class="shadow" tabindex="-1" required aria-hidden="true" name="${name}_v">`;
    const box = f.querySelector('[role=combobox]'), menu = f.querySelector('.menu'),
          shadow = f.querySelector('.shadow');
    const list = q => {
      const all = f.dataset.async ? (q ? cities : []) : f.dataset.options.split('|');
      return all.filter(o => o.toLowerCase().includes((q || '').toLowerCase()));
    };
    const show = items => {
      menu.innerHTML = items.map(o => `<div role="option">${o}</div>`).join('');
      menu.hidden = !items.length;
    };
    box.addEventListener('click', () => { if (!f.dataset.async) show(list('')); });
    box.addEventListener('input', () => {
      // Location suggestions arrive late, like a real places API; a full
      // "New York, NY" query finds nothing because suggestions say "…, USA"
      const q = box.value;
      if (f.dataset.async) {
        menu.hidden = true;
        setTimeout(() => show(q.includes(',') ? [] : list(q)), 700);
      } else show(list(q));
    });
    // react-select: Escape closes the menu and clears typed text
    box.addEventListener('keydown', e => { if (e.key === 'Escape') { menu.hidden = true; box.value = shadow.value; } });
    box.setAttribute('aria-expanded', 'false');
    new MutationObserver(() => box.setAttribute('aria-expanded', String(!menu.hidden)))
      .observe(menu, {attributes: true, attributeFilter: ['hidden']});
    menu.addEventListener('click', e => {
      if (e.target.getAttribute('role') !== 'option') return;
      box.value = shadow.value = e.target.textContent; menu.hidden = true;
    });
  });
</script>
</body></html>
