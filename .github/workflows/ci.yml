# Tests, the cloud image, and a live end-to-end check on every push.
#
#   test   the unit tests (with Chromium and LaTeX, so nothing is skipped)
#   image  builds the Docker image Fly.io runs, starts it, checks /healthz,
#          then runs `jobpipe selftest --fake` INSIDE it for Greenhouse, Lever,
#          Ashby and Workable: a real posting is fetched and its real form filled by a
#          made-up applicant.
#          Nothing is submitted. Pushes to main publish the image to
#          ghcr.io/<owner>/job-pipeline.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: LaTeX for resumes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Install
        run: |
          pip install -e '.[dev,apply,ai]'
          playwright install --with-deps chromium
      - name: Tests
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jobpipe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it like Fly does
        run: |
          mkdir -p data && sudo chown 10001 data
          docker run -d --name jp -p 8050:8050 -v "$PWD/data:/app/data" \
            -e JOBPIPE_DASHBOARD_TOKEN=ci-token-0123456789abcdef0123456789 jobpipe:ci
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8050/healthz; then echo; echo "healthy"; exit 0; fi
            sleep 3
          done
          docker logs jp; exit 1
      - name: Dashboard needs the password
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8050/api/summary)" = "401"
          curl -sf -H "Authorization: Bearer ci-token-0123456789abcdef0123456789" http://127.0.0.1:8050/api/summary
      - name: Setup check inside the image
        run: docker exec jp jobpipe doctor --online || true      # fails on purpose: no details in CI
      - name: Live self-test inside the image (fills real forms on all three kinds of board, sends nothing)
        run: |
          docker exec jp jobpipe selftest --fake --platform greenhouse --out /app/data/selftest/greenhouse
          docker exec jp jobpipe selftest --fake --platform lever --out /app/data/selftest/lever
          docker exec jp jobpipe selftest --fake --platform ashby --out /app/data/selftest/ashby
          docker exec jp jobpipe selftest --fake --platform workable --out /app/data/selftest/workable
          for p in greenhouse lever ashby workable; do
            docker exec jp python -c "import json; d=json.load(open('/app/data/selftest/$p/selftest.json')); print('$p needs you:', d.get('needs'))"
          done
      - name: Hiring posts from Hacker News and Bluesky (live, no AI)
        run: |
          sleep 30   # the server collects on its own after its first crawler pass
          docker exec jp python -c "
          from pipeline import leads
          r = leads.fetch(sources=['hn', 'bluesky'])
          print('this pass:', r['posts'], 'errors:', r['errors'])
          st = leads.LeadStore()
          c = st.counts(); print('collected so far:', c)
          for x in sorted(st.list(limit=500), key=lambda x: -x['score'])[:10]: print(round(x['score']), x['source'], x['company'], '|', x['role'], '|', x['visa'])
          assert c['posts_read'] > 20, 'too few posts read'
          assert c['by_source'].get('hn', 0) > 5, 'too few Hacker News leads'
          "
      - name: Crawler is running
        run: |
          sleep 20
          docker exec jp python -c "from pipeline.crawler.worker import read_status as r; s=r(); print(s.get('frontier'), s.get('last_hour')); [print('  error:', e.get('board'), e.get('error')) for e in s.get('errors', [])]; assert s.get('updated_at')"
      - name: Board coverage after a few minutes (live)
        run: |
          sleep 150
          docker exec jp python -c "
          from pipeline.crawler.worker import read_status as r
          from pipeline.tracker.db import Tracker
          s = r(); f = s.get('frontier') or {}
          print('seed:', s.get('last_seed')); print('lists:', s.get('last_links')); print('frontier:', f); print('last hour:', s.get('last_hour'))
          t = Tracker(); print('open matching roles:', t.count_open(), '| opened in the last day:', t.count_open(24))
          for j in t.open_jobs(limit=25): print('  ', j['company'], '|', j['title'], '|', j['location'])
          assert f.get('boards', 0) > 3000, 'seed did not add the company boards'
          "
      - name: Logs
        if: always()
        run: docker logs jp 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: data/selftest
          if-no-files-found: ignore
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/job-pipeline"
          docker tag jobpipe:ci "$IMG:latest" && docker tag jobpipe:ci "$IMG:${GITHUB_SHA::7}"
          docker push "$IMG:latest" && docker push "$IMG:${GITHUB_SHA::7}"
